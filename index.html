<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>xrio companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   XRIO companion — block UI
   Squares, hard edges, zero radius. Toggles are tiles in a two-column
   grid; anything carrying a *value* (dropdown, slider, keybind) spans
   the full width, because a tile can only say on/off and those need to
   show which value is selected.

   No shine sweeps, no gradient fills, no hover transforms. The old
   .ctrl-row::before swept a highlight left-to-right on hover and then
   animated it back right-to-left on hover-out — that reverse sweep is
   what read as a toggle "flipping twice". Motion here is limited to
   colour, so nothing can travel across a row.
   ==================================================================== */
:root {
  --accent:        #7c6cf0;
  --accent-deep:   #5a4bd4;
  --accent-text:   #c4b5fd;
  --accent-soft:   rgba(124, 108, 240, 0.14);
  --accent-edge:   #7c6cf0;
  --accent-glow:   rgba(124, 108, 240, 0.45);

  --bg-page:       #07070b;
  --panel-bg:      #0d0d15;
  --panel-hi:      #12121c;
  --titlebar-a:    #12121c;
  --titlebar-b:    #12121c;

  --surface-0:     #0a0a12;
  --surface-1:     #12121e;
  --elem:          #12121e;
  --elem-hover:    #1a1a2c;
  --elem-active:   #22223a;
  --slider-bg:     #1a1a2c;

  --text:          #e8e8f2;
  --subtext:       #a0a0bc;
  --muted:         #6a6a84;
  --disabled:      #4e4e66;

  --line:          #23233a;
  --line-soft:     #1a1a2a;
  --border-hair:   #1a1a2a;
  --border-soft:   #23233a;
  --border-strong: #33334e;

  --risk:          #f0b429;
  --risk-dim:      #6b5410;
  --risk-ink:      #1a1400;

  --shadow-panel:      0 18px 40px -18px rgba(0,0,0,0.85);
  --shadow-panel-glow: 0 18px 40px -18px rgba(0,0,0,0.85), 0 0 0 1px var(--accent-edge);

  --ease:    cubic-bezier(0.22, 1, 0.36, 1);
  --t-fast:  100ms var(--ease);
  --t-base:  150ms var(--ease);
  --t-slow:  260ms var(--ease);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
/* The `hidden` attribute is only `display:none` in the UA stylesheet, so any
   author rule setting display (every control here sets flex/grid/block) wins
   over it and the element stays on screen. Visibility collapse sets
   el.hidden, so without this the rows never actually disappear. */
[hidden] { display: none !important; }
body {
  background: var(--bg-page);
  color: var(--text);
  font-family: 'Geist', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  min-height: 100vh;
  overflow: hidden;
}

/* ── status bar ── */
.statusbar {
  position: fixed; top: 14px; left: 16px;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 13px;
  background: var(--panel-bg);
  border: 1px solid var(--line);
  z-index: 60;
  user-select: none;
}
.brand {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--muted);
  border-left: 1px solid var(--line);
  padding-left: 11px;
  margin-left: 3px;
}
.dot {
  width: 7px; height: 7px;
  background: var(--accent);
}
.dot.pulse { animation: dotPulse 1.6s ease-in-out infinite; }
.statusbar__tidy {
  font-family: 'Geist', system-ui, sans-serif;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--muted);
  background: var(--elem);
  border: 1px solid var(--line);
  padding: 4px 10px;
  margin-left: 3px;
  cursor: pointer;
  transition: color var(--t-base), border-color var(--t-base), background var(--t-base);
}
.statusbar__tidy:hover { color: var(--accent-text); border-color: var(--accent-edge); background: var(--elem-hover); }
@keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

/* ── panel ── */
.panel {
  position: absolute;
  width: 440px;
  max-height: calc(100vh - 40px);
  display: flex; flex-direction: column;
  background: var(--panel-bg);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-panel);
  animation: panelIn 260ms var(--ease) both;
}
@keyframes panelIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.panel:hover, .panel.dragging { box-shadow: var(--shadow-panel-glow); }
.panel.dragging { cursor: grabbing; }

.panel-title {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  background: var(--panel-hi);
  border-bottom: 1px solid var(--line);
  cursor: grab;
  user-select: none;
  flex-shrink: 0;
}
.panel-title__dot { width: 7px; height: 7px; background: var(--accent); flex-shrink: 0; }
.panel-title__name {
  flex: 1;
  font-size: 13.5px; font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.panel-title__count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--muted); flex-shrink: 0;
}

.panel-body { overflow-y: auto; overflow-x: hidden; flex: 1; }
.panel-body::-webkit-scrollbar { width: 8px; }
.panel-body::-webkit-scrollbar-track { background: var(--surface-0); }
.panel-body::-webkit-scrollbar-thumb { background: #24243a; }
.panel-body::-webkit-scrollbar-thumb:hover { background: #33334e; }

/* ── section header ── */
.section-divider {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 14px;
  background: var(--panel-bg);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  user-select: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.15em;
  color: #6a6a84;
  transition: background var(--t-base), color var(--t-base);
}
.section-divider:hover { background: var(--panel-hi); color: #9a9ab8; }
.section-divider.open { background: #151522; color: #a0a0bc; }
.section-divider__chev {
  display: flex; color: var(--muted);
  transition: transform var(--t-base), color var(--t-base);
  flex-shrink: 0;
}
.section-divider.open .section-divider__chev { transform: rotate(90deg); color: var(--accent); }
.section-divider__count {
  font-size: 10px; color: var(--disabled); margin-left: auto;
  letter-spacing: 0; flex-shrink: 0;
}
.section-divider__line { display: none; }

/* ── section body: the tile grid ──
   Toggles occupy one column each; everything else spans both. Keeping
   this a single grid (rather than nesting a wrapper around runs of
   toggles) means every control stays a direct child of .section-body,
   which is what the visibility collapse walks. */
.section-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  padding: 0 11px;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.26s var(--ease), opacity 0.2s var(--ease),
              padding 0.26s var(--ease);
  will-change: max-height;
}
.section-body.open { opacity: 1; padding: 11px; }

/* ── tile (toggle) ── */
.ctrl-row { color: var(--text); user-select: none; }

.toggle {
  position: relative;
  grid-column: span 1;
  min-height: 78px;
  padding: 11px 12px;
  display: flex; flex-direction: column; justify-content: space-between;
  background: var(--surface-1);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: background var(--t-base), border-color var(--t-base);
}
.toggle:hover { background: var(--elem-hover); border-color: var(--border-strong); }
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle.on:hover { background: #8b7bf5; border-color: #8b7bf5; }

.toggle .ctrl-row__label { display: block; min-width: 0; }
.toggle .ctrl-row__name {
  display: block;
  font-size: 13px; font-weight: 600; line-height: 1.3;
  color: #9a9ab4;
  white-space: normal;
  transition: color var(--t-base);
}
.toggle.on .ctrl-row__name { color: #fff; }
.toggle .ctrl-row__desc {
  font-size: 9.5px; line-height: 1.35;
  color: var(--disabled);
  margin-top: 0;
  transition: color var(--t-base);
}
.toggle.on .ctrl-row__desc { color: rgba(255,255,255,0.72); }

/* The pill is gone: the tile itself is the state. What remains is a
   corner wedge for risk and a mono ON/OFF word, both of which read at a
   glance from across the room — this panel lives on a second monitor. */
.toggle__pill {
  align-self: flex-end;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  color: #3c3c52;
  transition: color var(--t-base);
}
.toggle__pill::after { content: 'OFF'; }
.toggle.on .toggle__pill { color: rgba(255,255,255,0.9); }
.toggle.on .toggle__pill::after { content: 'ON'; }

.toggle__stripe { display: none; }

/* risk wedge — costs no line of text */
.toggle.risk::after {
  content: '';
  position: absolute; top: 0; right: 0;
  border-left: 18px solid transparent;
  border-top: 18px solid var(--risk-dim);
  transition: border-top-color var(--t-base);
}
.toggle.risk.on::after { border-top-color: var(--risk); }
.toggle.risk .ctrl-row__name { padding-right: 16px; }
/* The chip is redundant next to the wedge; keep it only for screen readers. */
.ctrl-row__risk {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

/* ── full-width rows: anything that carries a value ── */
.dropdown-wrap { grid-column: 1 / -1; }
.slider .ctrl-row__desc { padding: 2px 12px 0; }
.dropdown, .keybind {
  grid-column: 1 / -1;
  position: relative;
  display: flex; align-items: center; gap: 10px;
  min-height: 44px;
  padding: 10px 12px;
  background: var(--surface-0);
  border: 1px solid var(--line-soft);
  cursor: pointer;
  transition: background var(--t-base), border-color var(--t-base);
}
.dropdown:hover, .keybind:hover { background: var(--elem); border-color: var(--line); }

.dropdown .ctrl-row__label,
.keybind  .ctrl-row__label { flex: 1; min-width: 0; }
.ctrl-row__name {
  font-size: 12.5px; font-weight: 600;
  color: #c6c6da;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ctrl-row__desc {
  font-size: 9.5px; line-height: 1.35;
  color: var(--disabled);
  margin-top: 2px;
  white-space: normal;
}
.ctrl-row.has-desc { min-height: 52px; }

.dropdown__value {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px;
  background: var(--elem-active);
  border: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600;
  color: var(--accent-text);
  max-width: 190px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex-shrink: 0;
}
.dropdown__chev {
  display: flex; color: var(--muted); flex-shrink: 0;
  transition: transform var(--t-base);
}
.dropdown.open .dropdown__chev { transform: rotate(180deg); color: var(--accent-text); }
.dropdown__menu {
  display: none;
  flex-direction: column;
  max-height: 240px; overflow-y: auto;
  background: var(--surface-0);
  border: 1px solid var(--line);
  border-top: none;
}
.dropdown.open + .dropdown__menu { display: flex; }
.dropdown__opt {
  padding: 9px 13px;
  font-size: 12px;
  color: var(--subtext);
  cursor: pointer;
  border-bottom: 1px solid var(--line-soft);
  transition: background var(--t-fast), color var(--t-fast);
}
.dropdown__opt:last-child { border-bottom: none; }
.dropdown__opt:hover { background: var(--elem-hover); color: var(--text); }
.dropdown__opt.selected { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }

.keybind__chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
  padding: 6px 13px;
  background: var(--elem-active);
  border: 1px solid var(--line);
  color: var(--accent-text);
  flex-shrink: 0;
  transition: background var(--t-base), color var(--t-base), border-color var(--t-base);
}
.keybind:hover .keybind__chip { border-color: var(--accent-edge); }
.keybind__chip.listening {
  background: var(--accent); border-color: var(--accent); color: #fff;
  animation: keyBlink 1s steps(2, start) infinite;
}
@keyframes keyBlink { 50% { opacity: 0.5; } }

/* ── slider: the fill bar IS the block ── */
.slider {
  grid-column: 1 / -1;
  display: block;
  position: relative;      /* anchors .slider__val */
  padding: 0;
  background: var(--surface-0);
  border: 1px solid var(--line-soft);
  cursor: default;
}
.slider .ctrl-row__name {
  display: block;
  padding: 10px 12px 0;
  font-size: 12.5px; font-weight: 600;
  color: #c6c6da;
}
.slider__track {
  position: relative;
  height: 10px;
  margin: 9px 0 0;
  background: var(--slider-bg);
  cursor: pointer;
}
.slider__fill {
  position: absolute; left: 0; top: 0; height: 10px;
  background: var(--accent);
  transition: width var(--t-fast);
}
.slider__thumb { display: none; }
.slider__val {
  position: absolute; top: 10px; right: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
  color: var(--accent-text);
}

/* ── section search (large sections only) ── */
.sec-filter {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px;
  background: var(--surface-0);
  border: 1px solid var(--line-soft);
}
.sec-filter__icon { display: flex; color: var(--muted); flex-shrink: 0; }
.sec-filter__input {
  flex: 1; min-width: 0;
  background: transparent; border: none; outline: none;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
}
.sec-filter__input::placeholder { color: var(--disabled); }
.sec-filter__count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px; color: var(--disabled); flex-shrink: 0;
}

/* ── collapsed "not applicable in this mode" summary ── */
.inactive-note {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 9px;
  padding: 10px 12px;
  background: var(--surface-0);
  border: 1px dashed var(--line);
  cursor: pointer;
  user-select: none;
  transition: border-color var(--t-base);
}
.inactive-note:hover { border-color: var(--accent-edge); }
.inactive-note__text { font-size: 10.5px; color: var(--disabled); flex: 1; }
.inactive-note__action {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px; font-weight: 700; color: var(--accent);
}
.inactive-note__chev { display: flex; color: var(--disabled); transition: transform var(--t-base); }
.inactive-note.open .inactive-note__chev { transform: rotate(180deg); }
.empty-state {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  padding: 32px 40px;
  background: var(--panel-bg);
  backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  box-shadow: var(--shadow-panel);
}
.empty-state__title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}
.empty-state__hint {
  display: block;
  margin-top: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--accent-text);
  letter-spacing: 0.03em;
}
.empty-state__spinner {
  width: 24px; height: 24px;
  margin: 0 auto 16px;
  border-radius: 50%;
  border: 2px solid var(--border-strong);
  border-top-color: var(--accent);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── key gate (shown when no key / auth error) ── */
.gate-wrap {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 50;
  padding: 16px;
  pointer-events: none;
}
.gate {
  pointer-events: auto;
  width: 380px;
  max-width: 100%;
  padding: 32px 28px;
  background: var(--panel-bg);
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--border-soft);
  border-radius: 18px;
  box-shadow: var(--shadow-panel);
  text-align: center;
  animation: panelIn 0.45s var(--ease);
}
.gate__brand {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.32em;
  color: var(--accent-text);
  text-transform: uppercase;
  margin-bottom: 14px;
}
.gate__title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}
.gate__sub {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 22px;
  line-height: 1.5;
}
.gate__input {
  display: block; width: 100%;
  padding: 11px 14px;
  background: var(--slider-bg);
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  text-align: center;
  letter-spacing: 0.02em;
  outline: none;
  transition: border-color var(--t-base), box-shadow var(--t-base);
}
.gate__input:focus {
  border-color: var(--accent-edge);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.gate__input::placeholder { color: var(--muted); letter-spacing: 0.12em; }
.gate__btn {
  display: block; width: 100%; margin-top: 10px;
  padding: 11px;
  background: linear-gradient(135deg, var(--accent-text), var(--accent) 60%, var(--accent-deep));
  color: #fff;
  border: 1px solid var(--accent-edge);
  border-radius: 10px;
  font-family: inherit; font-size: 12px; font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  box-shadow: 0 0 12px var(--accent-glow);
  transition: transform var(--t-base), box-shadow var(--t-base);
}
.gate__btn:hover { transform: translateY(-1px); box-shadow: 0 0 18px var(--accent-glow); }
.gate__btn:active { transform: translateY(0); }
.gate__error {
  margin-top: 14px;
  padding: 8px 12px;
  background: rgba(255, 80, 80, 0.10);
  border: 1px solid rgba(255, 80, 80, 0.30);
  border-radius: 8px;
  color: #ffb0b0;
  font-size: 11px;
}
/* ── free self-serve signup (script is free; keys only separate sessions) ── */
.gate__divider {
  display: flex; align-items: center; gap: 10px;
  margin: 16px 0 12px;
  color: var(--muted); font-size: 10px; letter-spacing: 0.14em;
}
.gate__divider::before, .gate__divider::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-edge), transparent);
}
.gate__alt {
  display: block; width: 100%;
  padding: 10px;
  background: transparent;
  color: var(--accent-text);
  border: 1px dashed var(--accent-edge);
  border-radius: 10px;
  font-family: inherit; font-size: 12px; font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background var(--t-base), transform var(--t-base);
}
.gate__alt:hover { background: rgba(255,255,255,0.04); transform: translateY(-1px); }
.gate__alt:disabled { opacity: 0.55; cursor: default; transform: none; }
.gate__note {
  margin-top: 10px;
  color: var(--muted); font-size: 10.5px; line-height: 1.5;
}

/* ── loader command card (shown after auth, bottom-right) ── */
.loader-card {
  position: fixed;
  right: 16px; bottom: 16px;
  z-index: 90;
  width: 380px;
  max-width: calc(100vw - 32px);
  padding: 12px 14px;
  background: var(--panel-bg);
  backdrop-filter: blur(18px) saturate(150%);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  box-shadow: var(--shadow-panel);
  font-size: 11px;
  transition: opacity var(--t-base), transform var(--t-base);
}
.loader-card.collapsed { transform: translateY(calc(100% + 16px)); opacity: 0; pointer-events: none; }
.loader-card__head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
  font-size: 10px;
}
.loader-card__close {
  background: none; border: 0;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  padding: 0 4px;
  transition: color var(--t-base);
}
.loader-card__close:hover { color: var(--text); }
.loader-card__code {
  display: block;
  padding: 8px 10px;
  background: var(--slider-bg);
  border: 1px solid var(--border-hair);
  border-radius: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--accent-text);
  overflow-x: auto;
  white-space: nowrap;
  cursor: pointer;
  transition: background var(--t-base);
}
.loader-card__code:hover { background: var(--elem); }
.loader-card__hint {
  margin-top: 6px;
  color: var(--muted);
  font-size: 10px;
  text-align: center;
  letter-spacing: 0.04em;
}
.loader-card__hint.copied { color: var(--accent-text); }
.loader-card__signout {
  margin-top: 6px;
  text-align: center;
}
.loader-card__signout a {
  color: var(--muted);
  font-size: 10px;
  text-decoration: none;
  cursor: pointer;
  border-bottom: 1px dashed var(--border-soft);
}
.loader-card__signout a:hover { color: var(--accent-text); }
</style>
</head>
<body>

<!-- statusbar is rendered dynamically only when authenticated (see renderStatusbar) -->
<div class="panels-root" id="panels-root"></div>

<script>
/* ==========================================================================
   STATE — minimal, all WebSocket logic preserved from original.
   ========================================================================== */
// Broker URL: tunnel for hosted, direct ws:// for localhost
const TUNNEL_DEFAULT = 'grand-invitations-boat-formed.trycloudflare.com';
const WS_URL = (() => {
  const qp = new URLSearchParams(location.search).get('broker');
  if (qp) return (qp.startsWith('ws') ? qp : 'wss://' + qp + '/');
  const ls = localStorage.getItem('xrioBroker');
  if (ls) return (ls.startsWith('ws') ? ls : 'wss://' + ls + '/');
  const h = location.hostname;
  if (h === 'localhost' || h === '127.0.0.1' || h === '') return `ws://${location.host}/`;
  return 'wss://' + TUNNEL_DEFAULT + '/';
})();

// Same broker over plain HTTP, for the REST endpoints (/api/signup).
const HTTP_BASE = WS_URL.replace(/^ws/, 'http').replace(/\/$/, '');

// Customer key resolution: ?key= (URL) → localStorage → empty (prompt in UI)
let ACCESS_KEY = (() => {
  const qp = new URLSearchParams(location.search).get('key');
  if (qp) { try { localStorage.setItem('xrioKey', qp); } catch {} return qp; }
  return localStorage.getItem('xrioKey') || '';
})();
let authError = null;
function setAccessKey(k) {
  ACCESS_KEY = (k || '').trim();
  // Do NOT persist yet — wait for the broker to confirm the key is valid.
  // Persistence happens in ws.onmessage when 'init' arrives (auth succeeded).
  authError = null;
  if (ws) { try { ws.close(); } catch {} ws = null; }
  setStatus(false, false);
  showEmpty();
  setTimeout(connect, 100);
}
function clearAccessKey() {
  ACCESS_KEY = '';
  try { localStorage.removeItem('xrioKey'); } catch {}
  authError = null;
  if (ws) { try { ws.close(); } catch {} ws = null; }
  showEmpty();
}
let   ws = null;
let   schema = [];
let   flags = {};
let   luaConnected = false;
let   schemaSig = '';   // signature of last-built schema; rebuild only when this changes

/* Per-control update functions, keyed by flag.
   When a flag value arrives (from WS or local interaction), we call its
   update fn IN PLACE — no full DOM rebuild. This fixes:
     (a) slider drag (thumb no longer destroyed mid-drag)
     (b) stripe cascade pulse (only the toggled row's animation restarts) */
const controlRefs = new Map(); // flag -> (value) => void

/* Track which flag the user is currently dragging — incoming WS updates for
   that flag are ignored so the drag doesn't jump. */
let draggingFlag = null;

/* Send throttling for slider drag (don't flood Lua). */
let lastSendByFlag = new Map();
const SEND_THROTTLE_MS = 40;

/* ==========================================================================
   STATUS
   ========================================================================== */
function setStatus(brokerConnected, lua) {
  const dot = document.getElementById('dot');
  const txt = document.getElementById('status-text');
  if (!dot || !txt) return;   // statusbar not mounted yet (e.g. on gate screen)
  if (!brokerConnected) {
    dot.className = 'dot pulse';
    txt.textContent = 'reconnecting to broker…';
  } else if (!lua) {
    dot.className = 'dot pulse';
    txt.textContent = 'broker ok · waiting for Lua';
  } else {
    dot.className = 'dot live';
    txt.textContent = 'live · Lua connected';
  }
}

/* ==========================================================================
   WEBSOCKET — same protocol as before
   ========================================================================== */
let reconnectTimer = null;
let reconnectDelay = 1000;

// Reconnect through here, never by calling connect() from a timer directly:
// onclose used to schedule a fresh connect() unconditionally, so a flapping
// network could leave several sockets alive at once, each registering its own
// onclose — the same pile-up the Lua client had. Also backs off, because the
// broker runs on the user's own PC and is simply down whenever that PC is off;
// a fixed 1s retry meant tens of thousands of pointless dials overnight.
function scheduleReconnect() {
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connect();
  }, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 1.7, 30000);
}

function connect() {
  // Don't bother dialing the broker without a key — show the gate instead.
  if (!ACCESS_KEY) { showEmpty(); return; }
  // A socket that is still CONNECTING or OPEN must be torn down first,
  // otherwise this one stacks on top of it.
  if (ws) {
    try { ws.onclose = null; ws.onerror = null; ws.close(); } catch {}
    ws = null;
  }
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  try {
    ws = new WebSocket(WS_URL);
  } catch (err) {
    setStatus(false, false);
    scheduleReconnect();
    return;
  }
  ws.onopen = () => {
    reconnectDelay = 1000;          // a good connection resets the backoff
    setStatus(true, luaConnected);
    ws.send(JSON.stringify({ type: 'hello', role: 'ui', key: ACCESS_KEY }));
  };
  ws.onclose = (ev) => {
    setStatus(false, false);
    // 4401 = auth rejected — don't retry, clear bad key, show error
    if (ev && ev.code === 4401) {
      authError = ev.reason || 'auth rejected';
      ACCESS_KEY = '';
      try { localStorage.removeItem('xrioKey'); } catch {}
      showEmpty();
      return;
    }
    scheduleReconnect();
  };
  ws.onerror = () => {};
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }

    if (msg.type === 'auth_error') {
      authError = msg.reason || 'auth rejected';
      ACCESS_KEY = '';   // clear bad key so reload doesn't loop
      try { localStorage.removeItem('xrioKey'); } catch {}
      showEmpty();
      return;
    }
    if (msg.type === 'init') {
      // Auth succeeded — NOW persist the key so it survives reload.
      try { localStorage.setItem('xrioKey', ACCESS_KEY); } catch {}
      luaConnected = !!msg.lua_connected;
      schema = msg.schema || [];
      flags  = msg.flags  || {};
      setStatus(true, luaConnected);
      adoptVisibility();
      rebuildIfSchemaChanged();
      applyAllFlags();
      applyVisibility(lastVisibility);
    } else if (msg.type === 'lua_connected') {
      luaConnected = true;
      schema = msg.schema || schema;
      flags  = msg.flags  || flags;
      setStatus(true, true);
      adoptVisibility();
      rebuildIfSchemaChanged();
      applyAllFlags();
      applyVisibility(lastVisibility);
    } else if (msg.type === 'lua_disconnected') {
      luaConnected = false;
      setStatus(true, false);
      showEmpty();
    } else if (msg.type === 'flag' && msg.flag === '_visibility') {
      // Not a real control — the script uses this to say which options apply
      // in the current Aim Mode. Options that do nothing in the active mode
      // used to sit there looking usable (Wallbang (RCL) is Right Click Lock
      // only, Auto Shoot is Silent Aim only), which is the main reason the
      // panel read as cluttered.
      _dbg('VIS recv ' + JSON.stringify(msg.value));
      applyVisibility(msg.value || {});
      _dbg('VIS applied');
    } else if (msg.type === 'flag') {
      // The Lua side echoes every flag back, including the one this page just
      // set. Two guards, because value-equality alone was not enough: the
      // panel only ever repaints from an echo whose value MATCHES what the
      // click asked for, so a stale echo carrying the pre-click value cannot
      // drag a control back and make one click look like two.
      const prev = flags[msg.flag];
      const same = JSON.stringify(prev) === JSON.stringify(msg.value);
      const stale = isStaleEcho(msg.flag, msg.value);
      if (msg.flag === _watchFlag) _dbg(`ECHO ${msg.flag} prev=${JSON.stringify(prev)} new=${JSON.stringify(msg.value)} same=${same} stale=${stale}`);
      if (stale) return;              // keep flags[] too — it is what we asked for
      flags[msg.flag] = msg.value;
      if (!same && msg.flag !== draggingFlag) {
        const fn = controlRefs.get(msg.flag);
        if (fn) fn(msg.value, 'echo');
      }
    }
  };
}

/* ── pending writes ───────────────────────────────────────────────────────
   flag -> the value this page last asked for, held until the echo confirms
   it. While a flag is pending, an echo carrying anything else is a message
   that was already in flight when the click happened; applying it would move
   the control to the old value and then back, which is exactly the "it flips
   twice" behaviour. The entry self-clears after PENDING_MS so a dropped echo
   (Lua reconnecting, say) can never wedge a control permanently. */
const pending = new Map();
const PENDING_MS = 2000;

function markPending(flag, value) {
  const entry = { value, timer: null };
  const old = pending.get(flag);
  if (old && old.timer) clearTimeout(old.timer);
  entry.timer = setTimeout(() => {
    if (pending.get(flag) === entry) pending.delete(flag);
  }, PENDING_MS);
  pending.set(flag, entry);
}

function isStaleEcho(flag, value) {
  const entry = pending.get(flag);
  if (!entry) return false;
  if (JSON.stringify(entry.value) === JSON.stringify(value)) {
    clearTimeout(entry.timer);
    pending.delete(flag);       // confirmed — later echoes are honoured again
    return true;                // already painted at click time
  }
  return true;                  // in-flight leftover: ignore it
}

function send(payload) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(payload));
  }
}
function sendThrottled(flag, value) {
  const now = performance.now();
  if (!lastSendByFlag.has(flag) || now - lastSendByFlag.get(flag) > SEND_THROTTLE_MS) {
    lastSendByFlag.set(flag, now);
    send({ type: 'set_flag', flag, value });
  }
}

/* ==========================================================================
   DOM helpers
   ========================================================================== */
function el(tag, cls, txt) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
}

/* ==========================================================================
   PANEL DRAG — header drag, position persists in localStorage
   ========================================================================== */
/* Saved positions are only meaningful for the layout that produced them: the
   block redesign went from 280px panels to 440px, so every stored coordinate
   from before it packs panels on top of one another. Bumping this retires the
   old set rather than honouring coordinates that no longer fit. */
const LAYOUT_VERSION = 2;
function panelPositionKey(tab) { return 'xrio.panelpos.v' + LAYOUT_VERSION + '.' + tab; }

function makeDraggable(panel, header, tab) {
  let dx = 0, dy = 0, sx = 0, sy = 0, dragging = false;
  let zCounter = 10;
  const onMove = (ev) => {
    if (!dragging) return;
    const x = ev.clientX - dx;
    const y = ev.clientY - dy;
    // HARD AIR WALLS — entire panel must stay fully on screen.
    // No edge can leave the viewport. Bottom wall same as right/left.
    const pw = panel.offsetWidth, ph = panel.offsetHeight;
    const minLeft = 0;
    const maxLeft = Math.max(0, window.innerWidth  - pw);
    const minTop  = 48;                                   // below statusbar
    const maxTop  = Math.max(48, window.innerHeight - ph - 8);  // 8px bottom gap
    panel.style.left = Math.max(minLeft, Math.min(maxLeft, x)) + 'px';
    panel.style.top  = Math.max(minTop,  Math.min(maxTop,  y)) + 'px';
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    panel.classList.remove('dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    try {
      localStorage.setItem(panelPositionKey(tab), JSON.stringify({
        left: panel.offsetLeft, top: panel.offsetTop,
      }));
    } catch {}
    packTargets = packTargets.filter((x) => x !== panel);
  };
  header.addEventListener('mousedown', (ev) => {
    if (ev.button !== 0) return;
    dragging = true;
    sx = ev.clientX; sy = ev.clientY;
    dx = ev.clientX - panel.offsetLeft;
    dy = ev.clientY - panel.offsetTop;
    panel.style.zIndex = String(++zCounter + 50);
    panel.classList.add('dragging');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    ev.preventDefault();
  });
}

/* Initial layout for 5 panels: pack into rows that fit viewport. */
function initialLayout(count, panelW = 440, gap = 16) {
  const colsTry = Math.max(1, Math.floor((window.innerWidth - 2 * gap) / (panelW + gap)));
  const cols = Math.min(count, colsTry);
  const rows = Math.ceil(count / cols);
  const totalW = cols * panelW + (cols - 1) * gap;
  const startX = Math.max(gap, (window.innerWidth - totalW) / 2);
  const startY = 64; // below the statusbar
  const rowGap = 24;
  const out = [];
  for (let i = 0; i < count; i++) {
    const c = i % cols;
    const r = Math.floor(i / cols);
    out.push({
      left: Math.round(startX + c * (panelW + gap)),
      top:  Math.round(startY + r * (400 + rowGap)),  // 400 = approximate panel height
    });
  }
  return out;
}

/* ==========================================================================
   CONTROL BUILDERS — each returns {el, update}.
   `update(value)` mutates the row IN PLACE; no DOM recreation.
   ========================================================================== */
// TEMPORARY: trace exactly what touches a toggle's visual state. The earlier
// echo-dedupe fix did not stop the replay, so this records every path that can
// add or remove the `on` class, plus a stack hint, batched and numbered so the
// order is readable.
let _watchFlag = null;
let _t0 = Date.now(), _sq = 0, _buf = [], _tm = null;
function _dbg(m) {
  _buf.push(`${++_sq}@${Date.now() - _t0}ms ${m}`);
  if (_tm) return;
  _tm = setTimeout(() => {
    const p = _buf.join(' | '); _buf = []; _tm = null;
    try { fetch(HTTP_BASE + '/api/diag?msg=' + encodeURIComponent('[web] ' + p),
                { cache: 'no-store', mode: 'cors' }); } catch {}
  }, 600);
}

// Shared by every control type: the name, an optional RISK chip and an
// optional description line underneath.
function buildLabel(ctrl) {
  const wrap = el('div', 'ctrl-row__label');
  const top  = el('div', null);
  top.style.display = 'flex';
  top.style.alignItems = 'center';
  top.style.gap = '6px';
  top.appendChild(el('span', 'ctrl-row__name', ctrl.name));
  if (ctrl.risk) top.appendChild(el('span', 'ctrl-row__risk', 'RISK'));
  wrap.appendChild(top);
  if (ctrl.desc) wrap.appendChild(el('div', 'ctrl-row__desc', ctrl.desc));
  return wrap;
}

function buildToggle(ctrl) {
  // A tile, not a row: the whole block is the hit target and the fill is the
  // state. `risk` puts a wedge in the corner instead of a chip on the name
  // line, which keeps the name on one line at this tile width.
  const row  = el('div', 'ctrl-row toggle' + (ctrl.risk ? ' risk' : ''));
  const pill = el('div', 'toggle__pill');   // renders ON/OFF via ::after
  row.appendChild(buildLabel(ctrl));
  row.appendChild(pill);

  const update = (v, src) => {
    const on = !!v;
    const had = row.classList.contains('on');
    if (ctrl.flag === _watchFlag)
      _dbg(`update(${src||'?'}) ${ctrl.flag} ${had}->${on} ${had===on?'SKIP':'APPLY'}`);
    if (had === on) return;
    row.classList.toggle('on', on);
  };

  row.addEventListener('click', () => {
    const next = !flags[ctrl.flag];
    if (!_watchFlag) _watchFlag = ctrl.flag;   // trace only the first one clicked
    if (ctrl.flag === _watchFlag) _dbg(`CLICK ${ctrl.flag} -> ${next}`);
    flags[ctrl.flag] = next;
    update(next, 'click');
    applyShowWhen();
    markPending(ctrl.flag, next);
    send({ type: 'set_flag', flag: ctrl.flag, value: next });
  });

  return { el: row, update };
}

function buildSlider(ctrl) {
  const min  = (typeof ctrl.min === 'number') ? ctrl.min : 0;
  const max  = (typeof ctrl.max === 'number') ? ctrl.max : 100;
  const step = (typeof ctrl.step === 'number') ? ctrl.step : (max - min >= 100 ? 1 : 0.01);
  const suffix = ctrl.suffix || '';

  const row   = el('div', 'ctrl-row slider');
  const name  = el('div', 'ctrl-row__name', ctrl.name);
  const desc  = ctrl.desc ? el('div', 'ctrl-row__desc', ctrl.desc) : null;
  const track = el('div', 'slider__track');
  const fill  = el('div', 'slider__fill');
  const thumb = el('div', 'slider__thumb');
  const val   = el('div', 'slider__val');
  track.appendChild(fill);
  track.appendChild(thumb);
  row.appendChild(name);
  if (desc) row.appendChild(desc);
  row.appendChild(track);
  row.appendChild(val);

  const format = (v) => {
    if (ctrl.format) return ctrl.format.replace('{}', v);
    if (step >= 1) return Math.round(v) + suffix;
    const dec = Math.max(0, Math.ceil(-Math.log10(step)));
    return v.toFixed(dec) + suffix;
  };

  const update = (v) => {
    const clamped = Math.max(min, Math.min(max, v));
    const pct = (max > min) ? ((clamped - min) / (max - min)) * 100 : 0;
    fill.style.width = pct + '%';
    thumb.style.left = pct + '%';
    val.textContent = format(clamped);
  };

  const valueAt = (clientX) => {
    const r = track.getBoundingClientRect();
    let p = (clientX - r.left) / r.width;
    p = Math.max(0, Math.min(1, p));
    let v = min + p * (max - min);
    if (step) v = Math.round(v / step) * step;
    // Float guard
    v = Math.max(min, Math.min(max, v));
    return v;
  };

  const onMove = (ev) => {
    const v = valueAt(ev.clientX);
    flags[ctrl.flag] = v;
    update(v);
    sendThrottled(ctrl.flag, v);
  };
  const onUp = (ev) => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    row.classList.remove('dragging');
    const v = valueAt(ev.clientX);
    flags[ctrl.flag] = v;
    update(v);
    send({ type: 'set_flag', flag: ctrl.flag, value: v }); // final commit, unthrottled
    draggingFlag = null;
  };

  track.addEventListener('mousedown', (ev) => {
    if (ev.button !== 0) return;
    draggingFlag = ctrl.flag;
    row.classList.add('dragging');
    onMove(ev);  // jump-to-click on initial press
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    ev.preventDefault();
  });

  return { el: row, update };
}

function buildKeybind(ctrl) {
  const row  = el('div', 'ctrl-row keybind' + (ctrl.desc ? ' has-desc' : ''));
  const name = buildLabel(ctrl);
  const chip = el('div', 'keybind__chip', ctrl.default || 'None');
  row.appendChild(name);
  row.appendChild(chip);

  const update = (v) => { chip.textContent = v || 'None'; };

  let listening = false;
  let keyHandler = null;
  const stopListening = () => {
    listening = false;
    chip.classList.remove('listening');
    if (keyHandler) {
      window.removeEventListener('keydown', keyHandler);
      keyHandler = null;
    }
  };

  chip.addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (listening) { stopListening(); return; }
    listening = true;
    chip.textContent = '…';
    chip.classList.add('listening');
    keyHandler = (e) => {
      if (!listening) return;
      e.preventDefault();
      const key = e.key.length === 1 ? e.key.toUpperCase() : e.key;
      flags[ctrl.flag] = key;
      update(key);
      stopListening();
      send({ type: 'set_flag', flag: ctrl.flag, value: key });
    };
    window.addEventListener('keydown', keyHandler);
  });

  return { el: row, update };
}

function buildDropdown(ctrl) {
  // The wrapper is the grid child, so it (not .dropdown) carries the span.
  const wrap = el('div', 'dropdown-wrap');
  const row  = el('div', 'ctrl-row dropdown' + (ctrl.desc ? ' has-desc' : ''));
  const name = buildLabel(ctrl);
  const val  = el('div', 'dropdown__value', '');
  const chev = el('div', 'dropdown__chev');
  chev.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  row.appendChild(name); row.appendChild(val); row.appendChild(chev);

  const menu = el('div', 'dropdown__menu');
  const options = ctrl.options || [];
  const optEls = options.map(o => {
    const o2 = el('div', 'dropdown__opt', o);
    o2.dataset.value = o;
    menu.appendChild(o2);
    return o2;
  });

  wrap.appendChild(row);
  wrap.appendChild(menu);

  const update = (v) => {
    val.textContent = (v == null) ? '' : String(v);
    optEls.forEach((e) => e.classList.toggle('selected', e.dataset.value === v));
  };

  row.addEventListener('click', () => {
    const open = row.classList.toggle('open');
    if (open) {
      menu.style.display = 'flex';
      // close on outside click
      const onDoc = (ev) => {
        if (!wrap.contains(ev.target)) {
          row.classList.remove('open');
          menu.style.display = 'none';
          document.removeEventListener('mousedown', onDoc);
        }
      };
      setTimeout(() => document.addEventListener('mousedown', onDoc), 0);
    } else {
      menu.style.display = 'none';
    }
  });

  optEls.forEach((e) => {
    e.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const v = e.dataset.value;
      flags[ctrl.flag] = v;
      update(v);
      applyShowWhen();          // before the round trip, not after it
      send({ type: 'set_flag', flag: ctrl.flag, value: v });
      row.classList.remove('open');
      menu.style.display = 'none';
    });
  });

  return { el: wrap, update };
}

const BUILDERS = {
  toggle:   buildToggle,
  slider:   buildSlider,
  keybind:  buildKeybind,
  dropdown: buildDropdown,
};

/* ==========================================================================
   PANEL ASSEMBLY
   ========================================================================== */

function groupBySection(controls) {
  const out = [];
  const seen = new Map();  // section -> array index
  for (const c of controls) {
    const sec = c.section || 'MAIN';
    let idx = seen.get(sec);
    if (idx == null) { idx = out.length; out.push({ section: sec, items: [] }); seen.set(sec, idx); }
    out[idx].items.push(c);
  }
  return out;
}

// A section with dozens of controls (Skin Changer has 41) is unusable as a
// plain list — finding one weapon meant scrolling past forty. Sections past
// this size get a filter box; smaller ones are left alone.
const FILTER_THRESHOLD = 12;

function buildSectionFilter(secBody, itemCount) {
  const wrap = el('div', 'sec-filter');
  const icon = document.createElement('span');
  icon.className = 'sec-filter__icon';
  icon.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>';
  const input = el('input', 'sec-filter__input');
  input.type = 'text';
  input.placeholder = `\u641c\u7d22 ${itemCount} \u9879\u2026`;
  input.spellcheck = false;
  const count = el('div', 'sec-filter__count', String(itemCount));
  wrap.appendChild(icon);
  wrap.appendChild(input);
  wrap.appendChild(count);

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    let shown = 0;
    for (const row of secBody.children) {
      if (row === wrap) continue;
      const name = (row.dataset.ctrlName || '').toLowerCase();
      const hit = !q || name.includes(q);
      row.hidden = !hit;
      if (hit) shown++;
    }
    count.textContent = q ? `${shown} / ${itemCount}` : String(itemCount);
    secBody.style.maxHeight = 'none';
  });
  return wrap;
}

function buildPanel(tab, controls, index, total) {
  const panel = el('div', 'panel');
  panel.dataset.tab = tab;
  panel.style.animationDelay = (index * 70) + 'ms';

  const title = el('div', 'panel-title');
  const dot   = el('div', 'panel-title__dot');
  const tname = el('div', 'panel-title__name', tab);
  const count = el('div', 'panel-title__count', String(controls.length));
  title.appendChild(dot); title.appendChild(tname); title.appendChild(count);

  const body = el('div', 'panel-body');

  const grouped = groupBySection(controls);
  const sectionRefs = [];   // {divider, body} pairs for auto-collapse logic

  grouped.forEach((g, idx) => {
    const sectionName = (g.section && g.section !== 'MAIN') ? g.section : null;
    let divider, secBody;

    if (sectionName) {
      divider = el('div', 'section-divider');
      const chev = el('div', 'section-divider__chev');
      chev.innerHTML = '<svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M2.5 1L5.5 4L2.5 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      divider.appendChild(chev);
      divider.appendChild(el('span', null, sectionName));
      divider.appendChild(el('span', 'section-divider__count', String(g.items.length)));
      divider.appendChild(el('span', 'section-divider__line'));
      body.appendChild(divider);
    }

    secBody = el('div', sectionName ? 'section-body' : '');
    body.appendChild(secBody);
    if (g.items.length > FILTER_THRESHOLD) {
      secBody.appendChild(buildSectionFilter(secBody, g.items.length));
    }

    for (const c of g.items) {
      const builder = BUILDERS[c.type];
      if (!builder) continue;
      const { el: row, update } = builder(c);
      row.dataset.ctrlName = c.name || '';
      secBody.appendChild(row);
      controlRefs.set(c.flag, update);
      rowRefs.set(c.flag, row);
    }

    if (sectionName) {
      sectionRefs.push({ divider, secBody, name: sectionName });
      // (initial open of first section handled below via openSection so the
      // animation timing matches click-to-open)
    } else {
      // unnamed/MAIN section is always visible (no toggle)
      secBody.style.maxHeight = 'none';
      secBody.style.opacity = '1';
    }
  });

  // Animated open/close using measured scrollHeight (smooth precise timing)
  const openSection = (s) => {
    s.divider.classList.add('open');
    s.secBody.classList.add('open');
    const h = s.secBody.scrollHeight;
    s.secBody.style.maxHeight = h + 'px';
    // After transition completes, remove px constraint so content can grow
    clearTimeout(s._cleanup);
    s._cleanup = setTimeout(() => {
      if (s.divider.classList.contains('open')) s.secBody.style.maxHeight = 'none';
      schedulePack(60);
    }, 320);
  };
  const closeSection = (s) => {
    // Lock current pixel height so transition has a from-value, then collapse next frame
    s.secBody.style.maxHeight = s.secBody.scrollHeight + 'px';
    requestAnimationFrame(() => {
      s.divider.classList.remove('open');
      s.secBody.classList.remove('open');
      s.secBody.style.maxHeight = '0px';
      clearTimeout(s._cleanup);
      schedulePack(340);
    });
  };

  // Initial: open first section
  if (sectionRefs.length > 0) {
    // Defer one frame so scrollHeight is correct after DOM insert
    requestAnimationFrame(() => openSection(sectionRefs[0]));
  }

  // Click to expand/collapse + auto-close siblings if total would overflow viewport
  const VIEWPORT_BUDGET = () => window.innerHeight - 120;
  const estimateOpenHeight = (forceOpen) => {
    let h = 50; // titlebar + padding
    for (const s of sectionRefs) {
      h += 32; // section header
      const isOpen = s === forceOpen ? true : s.divider.classList.contains('open');
      if (isOpen) h += s.secBody.scrollHeight || s.secBody.children.length * 32;
    }
    return h;
  };
  sectionRefs.forEach((s) => {
    s.divider.addEventListener('click', () => {
      if (s.divider.classList.contains('open')) {
        closeSection(s);
        return;
      }
      // Close other open sections if this one would overflow
      if (estimateOpenHeight(s) > VIEWPORT_BUDGET()) {
        for (const other of sectionRefs) {
          if (other === s) continue;
          if (other.divider.classList.contains('open')) {
            closeSection(other);
            if (estimateOpenHeight(s) <= VIEWPORT_BUDGET()) break;
          }
        }
      }
      openSection(s);
    });
  });

  panel.appendChild(title);
  panel.appendChild(body);
  makeDraggable(panel, title, tab);
  return panel;
}

/* ── panel packing ───────────────────────────────────────────────────────
   Panels are absolutely positioned so they can be dragged, which means
   nothing reflows them when one grows. These pack the ones the user has
   never dragged (a dragged panel has a saved position and is left alone)
   into columns by MEASURED height. */
let packTargets = [];
let _packTimer = null;

function packPanels() {
  if (!packTargets.length) return;
  const gap = 16, top0 = 64;
  const colW = packTargets[0].offsetWidth + gap;
  const cols = Math.max(1, Math.floor((window.innerWidth - gap) / colW));
  const startX = Math.max(gap, (window.innerWidth - (cols * colW - gap)) / 2);
  const colY = new Array(cols).fill(top0);
  for (const panel of packTargets) {
    if (!panel.isConnected) continue;
    let c = 0;
    for (let k = 1; k < cols; k++) if (colY[k] < colY[c]) c = k;
    panel.style.left = Math.round(startX + c * colW) + 'px';
    panel.style.top  = Math.round(colY[c]) + 'px';
    colY[c] += panel.offsetHeight + gap;
  }
}

function schedulePack(delay) {
  clearTimeout(_packTimer);
  _packTimer = setTimeout(packPanels, delay);
}

/* Saved positions come from whatever window size and section state the user
   last had. Re-injecting with a different one — a resized window, a schema
   that grew a panel, sections left open — puts panels on top of each other or
   off the edge, which is what "every injection scrambles the UI" was. Rather
   than trust them blindly, check the result and rebuild the layout when it is
   visibly wrong. */
function layoutIsBroken() {
  const ps = [...document.querySelectorAll('.panel')];
  if (ps.length < 2) return false;
  const r = ps.map((e) => e.getBoundingClientRect());
  for (let i = 0; i < r.length; i++) {
    if (r[i].right < 40 || r[i].left > window.innerWidth - 40 ||
        r[i].bottom < 30 || r[i].top > window.innerHeight - 30 || r[i].top < 0) return true;
    for (let j = i + 1; j < r.length; j++) {
      if (r[i].left < r[j].right && r[j].left < r[i].right &&
          r[i].top < r[j].bottom && r[j].top < r[i].bottom) return true;
    }
  }
  return false;
}

/* Lay every panel out again and forget the stored coordinates, so the tidy
   survives the next injection instead of being undone by them. */
function tidyPanels() {
  packTargets = [...document.querySelectorAll('.panel')];
  packPanels();
  for (const panel of packTargets) {
    try { localStorage.removeItem(panelPositionKey(panel.dataset.tab)); } catch {}
  }
}

function rebuildIfSchemaChanged() {
  const root = document.getElementById('panels-root');
  // Remove empty state but keep statusbar + loader-card
  document.querySelectorAll('.empty-state, .gate').forEach(n => n.remove());
  renderStatusbar();    // ensure status bar exists
  renderLoaderCard();   // and the inject one-liner card

  if (!luaConnected || schema.length === 0) {
    renderEmptyConnected();
    return;
  }

  // Compute a signature; only rebuild when the schema *shape* changes.
  const sig = schema.map(c => `${c.tab}|${c.section || ''}|${c.flag}|${c.type}`).join('||');
  if (sig === schemaSig && root.children.length > 0) return;
  schemaSig = sig;

  // Wipe
  root.innerHTML = '';
  controlRefs.clear();
  rowRefs.clear();

  // Group by tab in insertion order
  const tabs = [];
  const tabMap = new Map();
  for (const c of schema) {
    const t = c.tab || 'Main';
    if (!tabMap.has(t)) { tabMap.set(t, []); tabs.push(t); }
    tabMap.get(t).push(c);
  }

  const positions = initialLayout(tabs.length);
  const autoPlaced = [];   // panels using the computed layout, not a saved one

  tabs.forEach((t, i) => {
    const panel = buildPanel(t, tabMap.get(t), i, tabs.length);
    // saved position takes priority over initial layout
    let pos = positions[i], saved = null;
    try { saved = localStorage.getItem(panelPositionKey(t)); } catch {}
    if (saved) { try { pos = JSON.parse(saved); } catch { saved = null; } }
    panel.style.left = pos.left + 'px';
    panel.style.top  = pos.top  + 'px';
    root.appendChild(panel);
    if (!saved) autoPlaced.push(panel);
  });

  // Pack the auto-placed panels by MEASURED height. initialLayout has to guess
  // a row height before anything is on screen, and its guess (400px) is far
  // short of an expanded Combat — which is how Misc ended up sitting on top of
  // it. Measuring after layout costs one frame and cannot guess wrong.
  // Sections animate open over 260ms, so a single measurement taken right
  // after build reads collapsed heights and packs them on top of each other.
  // Pack once the load animation settles, then again after any section opens
  // or closes — that is when a panel's height actually changes.
  packTargets = autoPlaced;
  setTimeout(packPanels, 420);    // after the load-time section open settles
  setTimeout(() => {
    packPanels();                 // once more, in case that frame was busy
    if (layoutIsBroken()) tidyPanels();
  }, 1100);

  // A rebuild throws away every row, so the collapse summaries go with them.
  // Re-derive them from the last map the script sent instead of waiting for the
  // next Aim Mode change, which may never come.
  applyShowWhen();
  if (Object.keys(lastVisibility).length) applyVisibility(lastVisibility);
}

/* Push current `flags` into every control once after a rebuild. */
// flag -> the row element, so visibility can be driven from the script.
const rowRefs = new Map();
let lastVisibility = {};

// The broker caches every flag the script sends, `_visibility` included, and
// replays them in the hello/lua_connected snapshot. Without this a page opened
// (or reconnected) after the script published its map would never see it — the
// one-off 'flag' message had already been and gone.
function adoptVisibility() {
  if (flags && flags._visibility && typeof flags._visibility === 'object')
    lastVisibility = flags._visibility;
}

/* Controls whose relevance depends on another control's VALUE declare it in
   the schema (`showWhen`). Resolving those here, from `flags`, means the panel
   reacts to its own click immediately — the script's _visibility map still
   governs Aim Mode, but a dependency the panel can work out for itself should
   never wait for a round trip. */
function showWhenSatisfied(ctrl) {
  const w = ctrl && ctrl.showWhen;
  if (!w || !w.flag) return true;
  let v = flags[w.flag];
  if (Array.isArray(v)) v = v[0];          // dropdowns arrive as a one-item list
  return String(v) === String(w.equals);
}

/* Apply every showWhen rule against the current flags. Cheap enough to run on
   any change: it touches only the controls that declared a rule. */
function applyShowWhen() {
  for (const c of schema) {
    if (!c.showWhen) continue;
    const row = rowRefs.get(c.flag);
    if (!row) continue;
    const ok = showWhenSatisfied(c);
    if (row.hidden === !ok) continue;
    row.hidden = !ok;
  }
}

function applyVisibility(map) {
  lastVisibility = map || {};
  const _visT0 = performance.now();

  // Options that do not apply in the current Aim Mode are collapsed behind one
  // summary line per section, not hidden outright: hiding them leaves no way to
  // discover what the other mode offers, and dimming them in place costs the
  // vertical room this panel does not have.
  applyShowWhen();
  const inactiveBySection = new Map();
  for (const [flag, shown] of Object.entries(lastVisibility)) {
    const row = rowRefs.get(flag);
    if (!row) continue;
    row.hidden = !shown;
    if (!shown) {
      const body = row.parentElement;
      if (!inactiveBySection.has(body)) inactiveBySection.set(body, []);
      inactiveBySection.get(body).push(row);
    }
  }

  document.querySelectorAll('.section-body').forEach((body) => {
    let note = body.querySelector(':scope > .inactive-note');
    const hiddenRows = inactiveBySection.get(body) || [];

    if (hiddenRows.length === 0) {
      if (note) note.remove();
    } else {
      if (!note) {
        note = el('div', 'inactive-note');
        const chev = el('div', 'inactive-note__chev');
        chev.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round"/></svg>';
        note.appendChild(chev);
        note.appendChild(el('div', 'inactive-note__text'));
        note.appendChild(el('div', 'inactive-note__action'));
        note.addEventListener('click', () => {
          const open = note.classList.toggle('open');
          for (const r of (inactiveBySection.get(body) || [])) r.hidden = !open;
          note.querySelector('.inactive-note__action').textContent = open ? '\u6536\u8d77' : '\u5c55\u5f00';
          body.style.maxHeight = 'none';
        });
        body.appendChild(note);
      }
      const open = note.classList.contains('open');
      for (const r of hiddenRows) r.hidden = !open;
      note.querySelector('.inactive-note__text').textContent =
        `${hiddenRows.length} \u9879\u5728\u5f53\u524d\u6a21\u5f0f\u4e0b\u4e0d\u9002\u7528`;
      note.querySelector('.inactive-note__action').textContent = open ? '\u6536\u8d77' : '\u5c55\u5f00';
      body.appendChild(note);   // keep it last
    }

    // Counts stop matching once rows collapse, so recompute from what shows.
    const visible = [...body.children].filter(
      (c) => !c.hidden && !c.classList.contains('inactive-note') && !c.classList.contains('sec-filter')
    ).length;
    const divider = body.previousElementSibling;
    const count = divider && divider.querySelector('.section-divider__count');
    if (count) count.textContent = String(visible);
  });
  _dbg('applyVisibility took ' + (performance.now() - _visT0).toFixed(1) + 'ms');
}

function applyAllFlags() {
  if (_watchFlag) _dbg('applyAllFlags()');
  for (const [flag, fn] of controlRefs.entries()) {
    if (flags[flag] !== undefined) fn(flags[flag], 'applyAll');
  }
}

function clearOverlays() {
  document.querySelectorAll('.empty-state, .gate, .loader-card, .statusbar').forEach(n => n.remove());
}

function renderStatusbar() {
  if (document.querySelector('.statusbar')) return;
  const bar = el('div', 'statusbar');
  const dot = el('div', 'dot pulse'); dot.id = 'dot';
  const txt = el('span', null, 'connecting\u2026'); txt.id = 'status-text';
  const brand = el('span', 'brand');
  brand.innerHTML = 'XRIO <span class="accent">v1</span>';
  bar.appendChild(dot); bar.appendChild(txt); bar.appendChild(brand);

  // Manual escape hatch. The automatic repair only fires when the layout is
  // measurably broken (overlapping or off-screen); a layout that is merely
  // untidy is a judgement call, so leave that button in reach.
  const tidy = el('button', 'statusbar__tidy', '\u6574\u7406');
  tidy.title = '\u91cd\u65b0\u6392\u5217\u6240\u6709\u9762\u677f';
  tidy.addEventListener('click', tidyPanels);
  bar.appendChild(tidy);

  document.body.appendChild(bar);
}

function renderGate() {
  // Wrap in a grid centerer so the gate is reliably in the viewport center
  // (independent of body padding / panel-root absolute positioning quirks).
  const wrap = el('div', 'gate-wrap');
  const g = el('div', 'gate');
  g.appendChild(el('div', 'gate__brand', 'XRIO Access'));
  g.appendChild(el('div', 'gate__title',
    authError ? 'Access denied' : 'Enter your access key'));
  const sub = el('div', 'gate__sub');
  if (authError) {
    sub.textContent =
      authError === 'expired'  ? 'That key has expired — just grab a fresh free one below.' :
      authError === 'revoked'  ? 'Your key was revoked.' :
      authError === 'unknown key' ? 'That key is invalid. Try again.' :
      ('Auth failed: ' + authError);
  } else {
    sub.textContent = 'Already have a key? Paste it below. Otherwise grab a free one.';
  }
  g.appendChild(sub);
  const input = el('input', 'gate__input');
  input.type = 'text';
  input.placeholder = 'xrio_\u2026';
  input.autocomplete = 'off';
  input.spellcheck = false;
  // After a rejection we leave the field BLANK so the user can clean-type.
  // (We don't pre-fill a known-bad key \u2014 that's just confusing.)
  g.appendChild(input);
  const btn = el('button', 'gate__btn', 'Connect');
  g.appendChild(btn);

  // \u2500\u2500 free self-serve key \u2500\u2500
  // xrio is free. A key still exists per person because broker sessions are
  // keyed by it \u2014 sharing one key would make users boot each other offline.
  g.appendChild(el('div', 'gate__divider', 'OR'));
  const claim = el('button', 'gate__alt', 'Get a free key');
  g.appendChild(claim);
  const note = el('div', 'gate__note',
    'Free forever. Your key is saved in this browser \u2014 keep it if you want the same session back.');
  g.appendChild(note);

  wrap.appendChild(g);
  document.body.appendChild(wrap);
  setTimeout(() => input.focus(), 80);

  const submit = () => {
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    setAccessKey(v);
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') submit(); });

  claim.addEventListener('click', async () => {
    claim.disabled = true;
    claim.textContent = 'Creating\u2026';
    try {
      const nm  = (prompt('Pick a name (so you can spot your session):', '') || '').trim();
      const res = await fetch(HTTP_BASE + '/api/signup?name=' + encodeURIComponent(nm),
                              { cache: 'no-store' });
      const j   = await res.json();
      if (!res.ok || !j.key) throw new Error(j.error || ('HTTP ' + res.status));
      note.textContent = 'Your key: ' + j.key + ' \u2014 saved. Connecting\u2026';
      setAccessKey(j.key);
    } catch (e) {
      claim.disabled = false;
      claim.textContent = 'Get a free key';
      note.textContent = 'Could not create a key: ' + e.message;
    }
  });
}

function renderLoaderCard() {
  if (document.querySelector('.loader-card')) return;
  // Build the executor one-liner with the key embedded.
  // Point at the BROKER, not Vercel. Roblox executors receive an empty body
  // from Vercel (verified 2026-08-31: len=0 even cache-busted, while the same
  // executor pulled 181893B from the tunnel), so Vercel hosts this UI only.
  // ..tick() runs at injection time, keeping the URL unique per run — executors
  // cache HttpGet by URL and ignore Cache-Control.
  const oneLiner =
    `_G._XRIO_KEY="${ACCESS_KEY}";loadstring(game:HttpGet("${HTTP_BASE}/loader.lua?v="..tick()))()`;
  const card = el('div', 'loader-card');
  const head = el('div', 'loader-card__head');
  head.appendChild(el('span', null, 'Inject in Roblox'));
  const closeBtn = el('button', 'loader-card__close', '\u00d7');
  closeBtn.title = 'hide (re-show by reopening the page)';
  closeBtn.onclick = () => card.classList.add('collapsed');
  head.appendChild(closeBtn);
  card.appendChild(head);
  const code = el('code', 'loader-card__code', oneLiner);
  card.appendChild(code);
  const hint = el('div', 'loader-card__hint', 'click code to copy');
  card.appendChild(hint);
  const signout = el('div', 'loader-card__signout');
  const a = el('a', null, 'sign out (clear saved key)');
  a.onclick = clearAccessKey;
  signout.appendChild(a);
  card.appendChild(signout);
  code.addEventListener('click', () => {
    navigator.clipboard.writeText(oneLiner).then(() => {
      hint.classList.add('copied');
      hint.textContent = '\u2713 copied \u2014 paste in your executor';
      setTimeout(() => { hint.classList.remove('copied'); hint.textContent = 'click code to copy'; }, 2500);
    }).catch(() => { hint.textContent = 'press Ctrl+C to copy'; });
  });
  document.body.appendChild(card);
}

function renderEmptyConnected() {
  const e = el('div', 'empty-state');
  e.appendChild(el('div', 'empty-state__spinner'));
  e.appendChild(el('div', 'empty-state__title',
    luaConnected ? 'Connected \u00b7 waiting for schema' : 'Inject xrio in Roblox'));
  e.appendChild(el('div', null,
    luaConnected ? 'Lua online, no schema yet.' : 'Paste the one-liner below into your executor.'));
  e.appendChild(el('span', 'empty-state__hint', 'key: ' + ACCESS_KEY.slice(0,12) + '\u2026'));
  document.body.appendChild(e);
}

function showEmpty() {
  const root = document.getElementById('panels-root');
  root.innerHTML = '';
  controlRefs.clear();
  schemaSig = '';

  clearOverlays();

  // No key OR auth rejected \u2192 big centered gate, nothing else.
  if (!ACCESS_KEY || authError) {
    renderGate();
    return;
  }

  // Key present but Lua not connected \u2192 status bar + connected-empty + loader card.
  renderStatusbar();
  renderEmptyConnected();
  renderLoaderCard();
}

/* ==========================================================================
   INIT
   ========================================================================== */
showEmpty();
connect();

/* Re-layout panels that never had saved positions when the viewport size changes
   (the user's first interaction usually anchors them; this only repositions
   panels that haven't moved). */
window.addEventListener('resize', () => schedulePack(120));
</script>
</body>
</html>
